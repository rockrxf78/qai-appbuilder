# Ethos-U85 reference Vela configuration (Arm Corstone-320 class).
# Numbers follow the public CMSIS Ethos-U U85 dedicated-SRAM profile
# (Ethos_U85_SYS_DRAM_Mid / Dedicated_Sram_384KB) and are not a board contract.
# Key names match configs/vela_psoc_e84.ini so the same Vela release accepts both.

[System_Config.corstone320_u85_syscfg]
core_clock = 1000e6
axi0_port = Sram
axi1_port = Dram
Sram_clock_scale = 1.0
Sram_burst_length = 32
Sram_read_latency = 32
Sram_write_latency = 32
Sram_max_reads = 64
Sram_max_writes = 32
Dram_clock_scale = 0.75
Dram_burst_length = 128
Dram_read_latency = 500
Dram_write_latency = 250
Dram_max_reads = 64
Dram_max_writes = 32

[Memory_Mode.corstone320_u85_dedicated_sram]
const_mem_area = Axi1
arena_mem_area = Axi1
cache_mem_area = Axi0
arena_cache_size = 393216

[Memory_Area.Sram]
size = 2MB
read_bandwidth = 64
write_bandwidth = 64

[Memory_Area.Dram]
size = 1024MB
read_bandwidth = 16
write_bandwidth = 16
