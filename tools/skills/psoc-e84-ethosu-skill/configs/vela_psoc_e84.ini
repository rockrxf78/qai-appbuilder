# PSoC Edge E84-oriented Vela configuration skeleton.
# Values are intentionally conservative and should be calibrated with
# board-level memory timings and linker placements.

[System_Config.psoc_e84_syscfg]
core_clock = 400e6
axi0_port = SRAM
axi1_port = DRAM
SRAM_clock_scales = 1.0
SRAM_burst_length = 32
SRAM_read_latency = 4
SRAM_write_latency = 4
DRAM_clock_scales = 0.5
DRAM_burst_length = 64
DRAM_read_latency = 32
DRAM_write_latency = 32
OnChipFlash_clock_scales = 0.25
OnChipFlash_burst_length = 32
OnChipFlash_read_latency = 64
OnChipFlash_write_latency = 64

[Memory_Mode.psoc_e84_balanced]
const_mem_area = OnChipFlash
arena_mem_area = SRAM
cache_mem_area = DRAM

[Memory_Area.SRAM]
size = 5MB
read_bandwidth = 32
write_bandwidth = 32

[Memory_Area.DRAM]
size = 32MB
read_bandwidth = 16
write_bandwidth = 16

[Memory_Area.OnChipFlash]
size = 128MB
read_bandwidth = 8
write_bandwidth = 2

[System_Config.corstone300_ref]
core_clock = 320e6
axi0_port = SRAM
axi1_port = OffChipFlash
SRAM_clock_scales = 1.0
SRAM_burst_length = 32
SRAM_read_latency = 4
SRAM_write_latency = 4
OffChipFlash_clock_scales = 0.2
OffChipFlash_burst_length = 32
OffChipFlash_read_latency = 64
OffChipFlash_write_latency = 64

[Memory_Mode.corstone300_ref_sram]
const_mem_area = OffChipFlash
arena_mem_area = SRAM
cache_mem_area = SRAM

[Memory_Area.OffChipFlash]
size = 64MB
read_bandwidth = 4
write_bandwidth = 1
