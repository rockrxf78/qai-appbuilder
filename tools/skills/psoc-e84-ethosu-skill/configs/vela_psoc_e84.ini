# PSoC Edge E84-oriented Vela configuration skeleton.
# Values are intentionally conservative and should be calibrated with
# board-level memory timings and linker placements.

[System_Config.psoc_e84_syscfg]
core_clock = 400e6
axi0_port = Sram
axi1_port = OffChipFlash
Sram_clock_scale = 1.0
Sram_burst_length = 32
Sram_read_latency = 4
Sram_write_latency = 4
Sram_max_reads = 8
Sram_max_writes = 8
OffChipFlash_clock_scale = 0.25
OffChipFlash_burst_length = 32
OffChipFlash_read_latency = 64
OffChipFlash_write_latency = 0
OffChipFlash_max_reads = 2
OffChipFlash_max_writes = 0

[Memory_Mode.psoc_e84_balanced]
const_mem_area = Axi1
arena_mem_area = Axi0
cache_mem_area = Axi0
arena_cache_size = 4194304

[Memory_Area.Sram]
size = 5MB
read_bandwidth = 32
write_bandwidth = 32

[Memory_Area.Dram]
size = 32MB
read_bandwidth = 16
write_bandwidth = 16

[System_Config.corstone300_ref]
core_clock = 320e6
axi0_port = Sram
axi1_port = OffChipFlash
Sram_clock_scale = 1.0
Sram_burst_length = 32
Sram_read_latency = 4
Sram_write_latency = 4
Sram_max_reads = 8
Sram_max_writes = 8
OffChipFlash_clock_scale = 0.2
OffChipFlash_burst_length = 32
OffChipFlash_read_latency = 64
OffChipFlash_write_latency = 64
OffChipFlash_max_reads = 2
OffChipFlash_max_writes = 1

[Memory_Mode.corstone300_ref_sram]
const_mem_area = Axi1
arena_mem_area = Axi0
cache_mem_area = Axi0
arena_cache_size = 393216

[Memory_Area.OffChipFlash]
size = 128MB
read_bandwidth = 8
write_bandwidth = 2
